<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 页面1：对话 ============ -->
  <div class="page active" id="pageChat">
    <div class="header">
      <h1>对话 <span id="currentTime" style="font-size:12px;color:var(--text-sub);margin-left:8px;font-weight:normal;"></span></h1>
      <div class="header-actions">
        <button class="icon-btn gear-btn" id="themeToggleBtn" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <button class="icon-btn gear-btn" id="chatSettingsBtn" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="page-body" id="chatListContainer">
      <div class="list-container" id="listContainer"></div>
    </div>

    <!-- 聊天详情 -->
    <div class="chat-detail" id="chatDetail">
      <div class="chat-header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="chat-title" id="chatTitle">聊天</div>
        <div class="chat-header-actions">
          <button class="small-icon-btn" id="manageRolesBtn">角色</button>
          <button class="small-icon-btn" id="chatMoreBtn">更多</button>
        </div>
      </div>
      <div class="quick-role-bar" id="quickRoleBar"></div>
      <div class="messages-container" id="messagesContainer"></div>
      <div class="input-area" id="chatInputArea">
        <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- ============ 页面2：动态 ============ -->
  <div class="page" id="pageDynamic">
    <div class="header"><h1>动态</h1></div>
    <div class="page-body">
      <div class="dynamic-compose">
        <textarea id="dynamicInput" placeholder="分享点什么..."></textarea>
        <div class="compose-footer">
          <div class="role-selector">
            <span class="role-selector-label">身份</span>
            <div class="role-select-btn" id="dynamicRoleBtn">
              <span class="role-select-dot" id="dynamicRoleDot"></span>
              <span id="dynamicRoleName">选择角色</span>
            </div>
          </div>
          <button class="publish-btn" id="publishBtn">发布</button>
        </div>
      </div>
      <div class="dynamic-list" id="dynamicList"></div>
    </div>
  </div>

  <!-- ============ 页面3：日记 ============ -->
  <div class="page" id="pageDiary">
    <div class="header"><h1>心情日记</h1></div>
    <div class="page-body">
      <div class="calendar-card">
        <div class="calendar-header">
          <div class="calendar-title" id="calendarTitle">2026年11月</div>
          <div class="calendar-nav">
            <button class="cal-nav-btn" id="prevMonthBtn">‹</button>
            <button class="cal-nav-btn" id="nextMonthBtn">›</button>
          </div>
        </div>
        <div class="calendar-weekdays">
          <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div>
          <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div>
          <div class="weekday">六</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="diary-legend" id="diaryLegend"></div>
      <div class="diary-list" id="diaryList"></div>
    </div>
  </div>

  <!-- ============ 页面4：创作 ============ -->
  <div class="page" id="pageCreative">
    <div class="header">
      <h1>创作</h1>
      <div class="header-actions">
        <button class="icon-btn" id="newCreativeBtn">新建书籍</button>
      </div>
    </div>
    <div class="page-body">
      <div class="creative-list" id="creativeList"></div>
    </div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="chat">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div class="nav-label">对话</div>
    </div>
    <div class="nav-item" data-tab="dynamic">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <div class="nav-label">动态</div>
    </div>
    <div class="nav-item" data-tab="diary">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="nav-label">日记</div>
    </div>
    <div class="nav-item" data-tab="creative">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <div class="nav-label">创作</div>
    </div>
  </div>
</div>

<!-- ============ 弹层与模态框 ============ -->

<!-- 主页设置菜单 -->
<div class="action-sheet" id="homeSettingsSheet">
  <div class="action-sheet-inner">
    <div class="action-sheet-title">对话设置</div>
    <button class="action-btn" id="menuNewChatBtn">新建对话</button>
    <button class="action-btn" id="menuImportBtn">导入对话</button>
    <button class="action-btn" id="menuBackupBtn">备份所有数据</button>
    <button class="action-btn cancel" id="homeMenuCancelBtn">取消</button>
  </div>
</div>

<!-- 聊天详情更多菜单 -->
<div class="action-sheet" id="chatMoreSheet">
  <div class="action-sheet-inner">
    <div class="action-sheet-title">更多操作</div>
    <button class="action-btn" id="menuRenameChatBtn">重命名本对话</button>
    <button class="action-btn" id="menuExportChatBtn">导出本对话</button>
    <button class="action-btn" id="menuExportChatImgBtn">导出聊天长图</button>
    <button class="action-btn cancel" id="chatMoreCancelBtn">取消</button>
  </div>
</div>

<!-- 消息气泡操作菜单 -->
<div class="action-sheet" id="msgActionSheet">
  <div class="action-sheet-inner">
    <div class="action-sheet-title">消息操作</div>
    <button class="action-btn" id="msgEditBtn">编辑文字</button>
    <button class="action-btn danger" id="msgDeleteBtn">删除这条消息</button>
    <button class="action-btn cancel" id="msgCancelBtn">取消</button>
  </div>
</div>

<!-- 新建/管理角色 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-title"><span id="modalTitleText">新建聊天</span><button class="modal-close" id="modalCloseBtn">×</button></div>
    <div class="modal-hint" id="modalHint">至少两个角色，指定一个主要角色（消息在右侧）。</div>
    <div id="roleCardsContainer"></div>
    <button class="add-role-btn" id="addRoleBtn">+ 添加角色</button>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
      <button class="btn btn-primary" id="confirmAddBtn">创建</button>
    </div>
  </div>
</div>

<!-- 导入 / 备份恢复 -->
<div class="modal-overlay" id="importModal">
  <div class="modal-content">
    <div class="modal-title">导入 / 恢复数据<button class="modal-close" id="importCloseBtn">×</button></div>
    <div class="modal-hint">选择之前导出的 JSON 备份文件，或粘贴内容。</div>
    <input type="file" id="importFileInput" accept=".json,application/json" style="margin-bottom:12px;font-size:13px;color:var(--text-sub);">
    <textarea id="importTextarea" class="input-simple" rows="5" placeholder="粘贴 JSON..." style="resize:none;font-family:monospace;font-size:12px;"></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="importCancelBtn">取消</button>
      <button class="btn btn-primary" id="importConfirmBtn">导入</button>
    </div>
  </div>
</div>

<!-- 重命名对话 -->
<div class="modal-overlay" id="renameModal">
  <div class="modal-content">
    <div class="modal-title">重命名对话<button class="modal-close" id="renameCloseBtn">×</button></div>
    <input type="text" id="renameInput" class="input-simple" placeholder="输入新标题" maxlength="30" style="margin-bottom:16px;">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="renameCancelBtn">取消</button>
      <button class="btn btn-primary" id="renameConfirmBtn">保存</button>
    </div>
  </div>
</div>

<!-- 编辑消息 -->
<div class="modal-overlay" id="editMsgModal">
  <div class="modal-content">
    <div class="modal-title">编辑消息<button class="modal-close" id="editMsgCloseBtn">×</button></div>
    <textarea id="editMsgInput" class="input-simple" rows="4" style="resize:none;font-family:inherit;margin-bottom:16px;"></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="editMsgCancelBtn">取消</button>
      <button class="btn btn-primary" id="editMsgConfirmBtn">保存</button>
    </div>
  </div>
</div>

<!-- 日记全屏编辑/阅读页 -->
<div class="diary-editor-page" id="diaryEditorPage">
  <div class="diary-editor-header">
    <button class="back-btn" id="diaryEditorBackBtn">←</button>
    <div class="diary-editor-date" id="diaryEditorDate"></div>
    <button class="small-icon-btn" id="diarySaveBtn">保存</button>
  </div>
  <div class="diary-editor-body">
    <div class="mood-picker" id="moodPicker"></div>
    <textarea id="diaryInput" class="diary-textarea" placeholder="今天发生了什么..."></textarea>
  </div>
</div>

<!-- 创作：书籍/卷/章节 列表页 -->
<div class="creative-manager" id="creativeManager">
  <div class="chat-header">
    <button class="back-btn" id="creativeManagerBackBtn">←</button>
    <div class="chat-title" id="creativeManagerTitle">书籍</div>
    <button class="small-icon-btn" id="creativeAddBtn">添加</button>
  </div>
  <div class="page-body">
    <div id="creativeManagerList" class="creative-list"></div>
  </div>
</div>

<!-- 创作：全屏富文本编辑器 -->
<div class="creative-editor" id="creativeEditor">
  <div class="creative-editor-header">
    <button class="back-btn" id="creativeEditorBackBtn">←</button>
    <input type="text" class="creative-title-input" id="creativeTitleInput" placeholder="章节名">
    <button class="small-icon-btn" id="creativeEditorSaveBtn">保存</button>
  </div>
  <div class="creative-toolbar" id="creativeToolbar">
    <div class="toolbar-row">
      <button class="tool-btn" id="toolBold"><b>B</b></button>
      <button class="tool-btn" id="toolItalic"><i>I</i></button>
      <button class="tool-btn" id="toolUnderline"><u>U</u></button>
      <button class="tool-btn" id="toolClear">清除</button>
      <button class="tool-btn" id="toolExportImg" style="margin-left:auto; background:#ffe2ea;">存图</button>
    </div>
    <div class="toolbar-row">
      <span class="tool-label">字体</span>
      <select class="tool-select" id="toolFontSelect">
        <option value="system">默认</option>
        <option value="kai">楷体</option>
        <option value="song">宋体</option>
      </select>
      <span class="tool-label">字色</span>
      <div class="tool-colors" id="toolColors"></div>
      <span class="tool-label">背景</span>
      <div class="tool-bgs" id="toolBgs"></div>
    </div>
  </div>
  <div class="creative-editor-body" id="creativeEditorBody">
    <div id="creativeBodyInput" class="creative-body-input" contenteditable="true" spellcheck="false" data-placeholder="开始写吧..."></div>
  </div>
  <div class="creative-editor-footer">
    <span id="creativeWordCount">0 字</span>
    <span id="creativeSaveStatus"></span>
  </div>
</div>

<!-- 动态角色选择 -->
<div class="action-sheet" id="rolePickSheet">
  <div class="action-sheet-inner">
    <div class="action-sheet-title">选择发布身份</div>
    <div id="rolePickList"></div>
    <button class="action-btn cancel" id="rolePickCancel">取消</button>
  </div>
</div>

<!-- 确认操作通用弹层 -->
<div class="action-sheet" id="confirmSheet">
  <div class="action-sheet-inner">
    <div class="action-sheet-title" id="confirmSheetTitle">确认操作</div>
    <button class="action-btn danger" id="confirmSheetOk">确定</button>
    <button class="action-btn cancel" id="confirmSheetCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="exportCanvas" style="display:none;"></canvas>

<script src="app.js"></script>
</body>
</html>
